# Test User Configuration
test.user.email=test@example.com
test.user.password=testPassword123!
test.user.name=Test User

# MongoDB Configuration
spring.data.mongodb.database=test
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.connect-timeout=30000
spring.data.mongodb.socket-timeout=30000
spring.data.mongodb.max-wait-time=30000
spring.data.mongodb.server-selection-timeout=30000

# JWT Configuration
jwt.secret=testSecretKeyThatIsLongEnoughForHS512AlgorithmAndMeetsSecurityRequirementsWithAtLeast64Bytes
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Spring Configuration
spring.main.allow-bean-definition-overriding=true
spring.security.basic.enabled=false
spring.security.user.name=none
spring.security.user.password=none

# Logging for tests
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.boot.test=DEBUG 