# Test Configuration
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.database=test

# Disable security for tests
spring.security.user.name=test
spring.security.user.password=test
spring.security.user.roles=USER

# Server Configuration
server.port=0

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mongo.enabled=true

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# Disable JPA auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.springframework.test=DEBUG
logging.level.org.springframework.boot.test=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.org.springframework.boot.context=DEBUG
logging.level.org.springframework.boot.web=DEBUG
logging.level.org.springframework.boot.web.servlet=DEBUG
logging.level.org.springframework.boot.web.servlet.filter=DEBUG
logging.level.org.springframework.boot.web.servlet.support=DEBUG
logging.level.org.springframework.boot.web.servlet.context=DEBUG
logging.level.org.springframework.boot.web.servlet.server=DEBUG
logging.level.org.springframework.boot.web.servlet.view=DEBUG 