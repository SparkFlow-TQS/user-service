services:
  user-app:
    environment:
      - APP_PORT=8081
      - SPRING_DATA_MONGODB_URI=mongodb://user-db:27017/sparkflow_user
      - MONGO_INITDB_DATABASE=sparkflow_user
    ports:
      - "8081:8081"

  user-db:
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=sparkflow_user 