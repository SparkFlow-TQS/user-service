name: Security and Quality Scan

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      TESTCONTAINERS_RYUK_DISABLED: true
      TESTCONTAINERS_CHECKS_DISABLE: true
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: "docker.io"
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Docker Login (to avoid rate limits)
        if: secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_PASSWORD
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Pre-pull MongoDB image for Testcontainers
        run: docker pull mongo:7.0

      - name: Build and Run Dependency Check
        run: |
          ./mvnw clean verify org.owasp:dependency-check-maven:check \
            -Ddependency-check.failBuildOnCVSS=7 \
            -Dnvd.api.key=${{ secrets.NVD_API_KEY }} \
            -Ddependency-check.nvd.apiUrl=https://services.nvd.nist.gov/rest/json/cves/2.0 \
            -Ddependency-check.nvd.apiDelay=6000 \
            -Ddependency-check.nvd.validForHours=24

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      - name: Start MongoDB Container (for manual override, optional)
        run: |
          docker run -d \
            --name mongodb \
            -p 27017:27017 \
            mongo:7.0
          sleep 10  # Wait for MongoDB to start

      - name: Start Spring Boot Application
        run: |
          ./mvnw clean package -DskipTests
          nohup java -jar target/user-service-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=test \
            --spring.data.mongodb.uri=mongodb://localhost:27017/sparkflow_user &
          for i in {1..30}; do
            if curl -s http://localhost:8081/actuator/health > /dev/null; then
              echo "Application is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Application failed to start within 30 seconds"
              exit 1
            fi
            echo "Waiting for application to start... ($i/30)"
            sleep 1
          done

      - name: OWASP ZAP Scan
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          mkdir -p zap-output
          chmod 755 zap-output
          docker run -v $(pwd)/zap-output:/zap/wrk/:rw \
            --network host \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:8081 \
            -g gen.conf \
            -r testreport.html
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-output/testreport.html

      - name: Stop Spring Boot Application and Clean Up
        if: always()
        run: |
          pkill -f 'user-service' || true
          docker stop mongodb || true
          docker rm mongodb || true
